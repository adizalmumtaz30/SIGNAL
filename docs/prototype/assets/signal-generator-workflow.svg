<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="title desc">
<title id="title">Proses penyusunan jadwal SIGNAL</title>
<desc id="desc">Ilustrasi orisinal operator sekolah menyusun jadwal menggunakan laptop dan lembar jadwal, dengan siluet kampus kontemporer di latar belakang.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf1e7"/><stop offset="1" stop-color="#d7e4d8"/></linearGradient>
 <linearGradient id="window" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d3e3d9"/><stop offset="1" stop-color="#99b9a8"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#315f52"/><stop offset="1" stop-color="#183f36"/></linearGradient>
</defs>
<rect width="520" height="300" rx="18" fill="url(#bg)"/>
<circle cx="425" cy="58" r="27" fill="#f3e9cf" opacity=".8"/>
