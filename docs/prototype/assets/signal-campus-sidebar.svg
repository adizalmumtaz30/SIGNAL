  <path d="M493 169 646 203V219L493 235Z" fill="#d8e1d5"/>
  <path d="M350 197 474 173V224L350 232Z" fill="#315e52"/>
  <path d="M365 194 388 189V228L365 232Z" fill="#94b8aa"/>
