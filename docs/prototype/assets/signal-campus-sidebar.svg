  <path d="M439 178 462 173V218L439 222Z" fill="#91b5a6"/>
  <path d="M350 197 474 173" stroke="#d9c59a" stroke-width="3"/>
  <path d="M342 236 483 211 500 215 360 243Z" fill="#b58d58"/>
