   <path d="M107 221 111 159 118 157 119 222" fill="#725d45"/>
   <path d="M115 174C83 164 80 133 101 121 94 102 119 86 137 101 154 85 178 104 170 125 193 138 178 168 153 170 145 187 124 187 115 174Z" fill="#668d6d"/>
   <path d="M102 143Q121 121 147 117M116 162Q145 136 169 135" fill="none" stroke="#93ae87" stroke-width="2" opacity=".7"/>
   <path d="M630 215 633 164 640 162 641 214" fill="#725d45"/>
   <path d="M635 173C610 162 612 139 629 128 623 111 645 97 659 111 677 101 696 119 687 138 705 151 688 177 669 176 660 188 641 186 635 173Z" fill="#648b6a"/>
   <path d="M625 151Q647 132 673 128M640 170Q659 146 687 144" fill="none" stroke="#95b28b" stroke-width="2" opacity=".7"/>
  </g>
  <!-- restrained ornamental planting -->
  <g fill="#789a76">
   <path d="M42 244q-4-20 8-30 4 18-8 30m4 2q4-23 20-27-2 18-20 27m-8 2q-12-15-7-27 12 12 7 27"/>
   <path d="M574 239q-4-19 8-29 4 17-8 29m5 2q5-22 20-26-3 17-20 26m-9 2q-12-14-7-26 12 11 7 26"/>
  </g>
