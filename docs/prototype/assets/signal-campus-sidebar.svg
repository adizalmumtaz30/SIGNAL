  <path d="M185 113 305 76 416 104 301 132Z" fill="#6c8d79"/>
  <path d="M200 117 304 87 304 181 200 199Z" fill="#f5f1e5"/>
  <path d="M314 91 402 113V183L314 178Z" fill="#e5e9dc"/>
