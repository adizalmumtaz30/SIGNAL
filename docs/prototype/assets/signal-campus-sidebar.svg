<svg xmlns="http://www.w3.org/2000/svg" viewBox="350 12 285 248" role="img" aria-labelledby="title desc">
<title id="title">Detail vertikal kampus sekolah SIGNAL</title>
<desc id="desc">Detail bangunan sekolah kontemporer dengan fasad kaca dan taman. Tidak ada bentuk masjid.</desc>
<g>
  <defs>
   <linearGradient id="arch-sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f4f0e5"/><stop offset=".58" stop-color="#dce8dc"/><stop offset="1" stop-color="#c4d9cb"/>
   </linearGradient>
   <linearGradient id="arch-glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a6c7bb"/><stop offset=".45" stop-color="#668f83"/><stop offset="1" stop-color="#315f54"/>
   </linearGradient>
   <linearGradient id="arch-stone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fffdf5"/><stop offset="1" stop-color="#d9dfd2"/>
   </linearGradient>
   <linearGradient id="arch-ground" x1="0" y1="0" x2=".6" y2="1">
    <stop offset="0" stop-color="#a9bea5"/><stop offset="1" stop-color="#647f69"/>
