  <path d="M606 82V31" stroke="#6e796a" stroke-width="1.6"/>
  <path d="M607 33 631 39 607 45Z" fill="#b65e4d"/>
  <!-- tiny people for scale -->
  <g>
   <circle cx="258" cy="208" r="3.7" fill="#3e5147"/><path d="M254 212h8l3 17h-13Z" fill="#e4e0d1"/><path d="M256 228 253 237m7-9 4 9" stroke="#3e5147" stroke-width="1.7"/>
   <circle cx="532" cy="204" r="3.6" fill="#3e5147"/><path d="M528 208h8l3 16h-13Z" fill="#c08f56"/><path d="M530 223 527 233m7-10 4 10" stroke="#3e5147" stroke-width="1.7"/>
   <circle cx="551" cy="202" r="3.4" fill="#3e5147"/><path d="M547 206h8l3 15h-13Z" fill="#f1eee2"/><path d="M549 221 546 231m7-10 4 10" stroke="#3e5147" stroke-width="1.6"/>
  </g>
  <!-- a restrained sunlit edge that gives the illustration depth -->
  <path d="M292 92 487 34 676 82" fill="none" stroke="#fffdf4" stroke-width="2" opacity=".8"/>
 </g>
</svg>